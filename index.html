
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Activity Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 28px;
      color: #172554;
      font-size: 30px;
    }

    h2 {
      margin: 0 0 20px;
      color: #1e3a8a;
      font-size: 23px;
    }

    h3 {
      margin: 0;
      color: #1e40af;
      font-size: 20px;
    }

    .section {
      margin-bottom: 30px;
      padding-bottom: 28px;
      border-bottom: 1px solid #e5e7eb;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 24px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    label {
      margin-bottom: 8px;
      font-weight: 700;
      color: #1e3a5f;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input:disabled,
    select:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .required {
      color: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    .location-box {
      padding: 18px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .month-box {
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }

    .month-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .month-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .month-status.completed {
      background: #dcfce7;
      color: #166534;
    }

    .month-status.locked {
      background: #e5e7eb;
      color: #64748b;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 44px;
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #1d4ed8;
      color: #ffffff;
    }

    .btn-success {
      background: #15803d;
      color: #ffffff;
    }

    .btn-warning {
      background: #d97706;
      color: #ffffff;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-secondary {
      background: #64748b;
      color: #ffffff;
    }

    .editing-label {
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      font-weight: 700;
    }

    .activity-list {
      margin-top: 18px;
    }

    .activity-card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #ffffff;
    }

    .activity-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .activity-card-title {
      color: #1e3a8a;
      font-size: 18px;
      font-weight: 700;
    }

    .activity-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .activity-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 20px;
    }

    .detail-item {
      font-size: 14px;
      line-height: 1.6;
    }

    .detail-item strong {
      color: #334155;
    }

    .empty-message {
      padding: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      text-align: center;
      color: #64748b;
      background: #f8fafc;
    }

    .status-message {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: 700;
    }

    .status-success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .status-error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .locked-month {
      opacity: 0.65;
      background: #f8fafc;
    }

    .locked-message {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .summary-item {
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .summary-label {
      color: #64748b;
      font-size: 13px;
    }

    .summary-value {
      margin-top: 5px;
      color: #1e3a8a;
      font-size: 24px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 20px 16px;
      }

      .form-grid,
      .activity-detail-grid,
      .summary-box {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .activity-card-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Partner Activity Form</h1>

    <!-- Partner Information -->
    <div class="section">
      <h2>Partner Information</h2>

      <div class="form-grid">
        <div class="field">
          <label for="region">
            Region <span class="required">*</span>
          </label>

          <select id="region" required>
            <option value="">Select Region</option>
            <option value="BKK">BKK</option>
            <option value="CEW">CEW</option>
            <option value="N">N</option>
            <option value="NE">NE</option>
            <option value="S">S</option>
          </select>
        </div>

        <div class="field">
          <label for="partner">
            Partner <span class="required">*</span>
          </label>

          <select id="partner" required disabled>
            <option value="">Select Partner</option>
          </select>
        </div>

        <div class="field">
          <label for="planningMonth">
            Planning Month <span class="required">*</span>
          </label>

          <select id="planningMonth" required>
            <option value="">Select Month</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Activity Form -->
    <div class="section">
      <h2>Add Activity</h2>

      <div id="editingLabel" class="editing-label hidden">
        Editing existing activity
      </div>

      <form id="activityForm">
        <div class="form-grid">
          <div class="field">
            <label for="activityType">
              Activity Type <span class="required">*</span>
            </label>

            <select id="activityType" required>
              <option value="">Select Activity Type</option>
              <option value="Pop up/Roadshow">Pop up/Roadshow</option>
              <option value="Showroom event">Showroom event</option>
              <option value="Test Drive/Outdoor event">
                Test Drive/Outdoor event
              </option>
              <option value="Online">Online</option>
              <option value="Mini motor show">Mini motor show</option>
              <option value="Billboard">Billboard</option>
            </select>
          </div>

          <div class="field">
            <label for="location">
              Location <span class="required">*</span>
            </label>

            <select id="location" required>
              <option value="">Select Location</option>
            </select>
          </div>

          <div class="field full-width hidden" id="locationDetailWrapper">
            <label for="locationDetail">
              Branch / Area / Location Detail
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="locationDetail"
              placeholder="Enter branch, area or location"
            />
          </div>

          <div class="field">
            <label for="startDate">
              Start Date <span class="required">*</span>
            </label>

            <input type="date" id="startDate" required />
          </div>

          <div class="field">
            <label for="endDate">
              End Date <span class="required">*</span>
            </label>

            <input type="date" id="endDate" required />
          </div>

          <div class="field">
            <label for="cost">
              Cost <span class="required">*</span>
            </label>

            <input
              type="number"
              id="cost"
              min="0"
              step="0.01"
              placeholder="Enter cost"
              required
            />
          </div>

          <div class="field">
            <label for="leadsTarget">Leads Target</label>

            <input
              type="number"
              id="leadsTarget"
              min="0"
              placeholder="Enter Leads Target"
            />
          </div>

          <div class="field">
            <label for="testDriveTarget">Test Drive Target</label>

            <input
              type="number"
              id="testDriveTarget"
              min="0"
              placeholder="Enter Test Drive Target"
            />
          </div>

          <div class="field">
            <label for="bookingTarget">Booking Target</label>

            <input
              type="number"
              id="bookingTarget"
              min="0"
              placeholder="Enter Booking Target"
            />
          </div>

          <div class="field full-width">
            <label for="remark">Remark</label>

            <textarea
              id="remark"
              placeholder="Enter remark"
            ></textarea>
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="btn-primary" id="saveButton">
            Save Activity
          </button>

          <button
            type="button"
            class="btn-secondary hidden"
            id="cancelEditButton"
          >
            Cancel Edit
          </button>

          <button
            type="button"
            class="btn-success"
            id="finishMonthButton"
          >
            Finish Month & Continue
          </button>

          <button
            type="button"
            class="btn-primary"
            id="submitAllButton"
          >
            Submit All Activities
          </button>
        </div>
      </form>

      <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- Monthly Activities -->
    <div class="section">
      <h2>Monthly Activity Planning</h2>

      <div id="monthlyActivities"></div>
    </div>
  </div>

  <script>

      ],

      S: [

      ]
    };

    const shoppingLocations = [
      "Big C",
      "Central",
      "Fashion Island",
      "Home Pro",
      "Lotus",
      "Makro",
      "Market Village",
      "Robinson",
      "Seacon",
      "The Mall",
      "Terminal 21",
      "Mega Bangna",
      "The Street",
      "Future park",
      "PTT",
      "Bangchak",
      "Café",
      "University",
      "Other"
    ];

    const onlineChannels = [
      "Line",
      "Facebook",
      "Google",
      "Instagram",
      "Tiktok",
      "YouTube"
    ];

    const testDriveLocations = [
      "Showroom",
      "Outdoor"
    ];

    const regionInput = document.getElementById("region");
    const partnerInput = document.getElementById("partner");
    const planningMonthInput = document.getElementById("planningMonth");

    const activityForm = document.getElementById("activityForm");
    const activityTypeInput = document.getElementById("activityType");
    const locationInput = document.getElementById("location");
    const locationDetailInput = document.getElementById("locationDetail");
    const locationDetailWrapper =
      document.getElementById("locationDetailWrapper");

    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const costInput = document.getElementById("cost");
    const leadsTargetInput = document.getElementById("leadsTarget");
    const testDriveTargetInput =
      document.getElementById("testDriveTarget");
    const bookingTargetInput =
      document.getElementById("bookingTarget");
    const remarkInput = document.getElementById("remark");

    const saveButton = document.getElementById("saveButton");
    const cancelEditButton =
      document.getElementById("cancelEditButton");
    const finishMonthButton =
      document.getElementById("finishMonthButton");
    const submitAllButton =
      document.getElementById("submitAllButton");

    const editingLabel =
      document.getElementById("editingLabel");
    const monthlyActivitiesContainer =
      document.getElementById("monthlyActivities");
    const statusMessage =
      document.getElementById("statusMessage");

    let savedActivities = JSON.parse(
      localStorage.getItem("partnerActivityData") || "[]"
    );

    let selectedPlanningMonth = "";
    let editingId = null;
    let completedMonths = JSON.parse(
      localStorage.getItem("partnerCompletedMonths") || "[]"
    );

    function generateId() {
      return (
        "ACT-" +
        Date.now() +
        "-" +
        Math.random().toString(36).substring(2, 8)
      );
    }

    function saveToLocalStorage() {
      localStorage.setItem(
        "partnerActivityData",
        JSON.stringify(savedActivities)
      );

      localStorage.setItem(
        "partnerCompletedMonths",
        JSON.stringify(completedMonths)
      );
    }

    function getMonthValue(date) {
      return date.toISOString().substring(0, 7);
    }

    function getMonthLabel(monthValue) {
      const date = new Date(monthValue + "-01T00:00:00");

      return date.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    function getPlanningMonths() {
      if (!selectedPlanningMonth) {
        return [];
      }

      const [year, month] = selectedPlanningMonth
        .split("-")
        .map(Number);

      const months = [];

      for (let i = 0; i < 3; i++) {
        const date = new Date(year, month - 1 + i, 1);

        const value =
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0");

        months.push({
          value,
          label: getMonthLabel(value)
        });
      }

      return months;
    }

    function populatePlanningMonths() {
      const today = new Date();

      planningMonthInput.innerHTML =
        '<option value="">Select Month</option>';

      for (let i = 0; i < 3; i++) {
        const date = new Date(
          today.getFullYear(),
          today.getMonth() + i,
          1
        );

        const value =
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0");

        const option = document.createElement("option");

        option.value = value;
        option.textContent = getMonthLabel(value);

        planningMonthInput.appendChild(option);
      }
    }

    function getVisibleMonths() {
      const months = getPlanningMonths();

      if (months.length === 0) {
        return [];
      }

      let visibleCount = 1;

      for (let i = 0; i < months.length - 1; i++) {
        const currentMonth = months[i].value;

        const hasActivity = savedActivities.some(
          activity =>
            activity.planningMonth === currentMonth
        );

        const isCompleted = completedMonths.includes(
          currentMonth
        );

        if (hasActivity && isCompleted) {
          visibleCount++;
        } else {
          break;
        }
      }

      return months.slice(0, visibleCount);
    }

    function isMonthCompleted(monthValue) {
      return completedMonths.includes(monthValue);
    }

    function getActivitiesByMonth(monthValue) {
      return savedActivities.filter(
        activity =>
          activity.planningMonth === monthValue
      );
    }

    function renderMonthlyActivities() {
      monthlyActivitiesContainer.innerHTML = "";

      if (!selectedPlanningMonth) {
        monthlyActivitiesContainer.innerHTML = `
          <div class="empty-message">
            Please select a Planning Month first.
          </div>
        `;
        return;
      }

      const visibleMonths = getVisibleMonths();

      visibleMonths.forEach((month, index) => {
        const activities = getActivitiesByMonth(month.value);
        const completed = isMonthCompleted(month.value);

        const monthBox = document.createElement("div");
        monthBox.className = "month-box";
        monthBox.style.marginBottom = "20px";

        monthBox.innerHTML = `
          <div class="month-title">
            <h3>${escapeHtml(month.label)}</h3>
            <span class="month-status ${
              completed ? "completed" : ""
            }">
              ${completed ? "Completed" : "In Progress"}
            </span>
          </div>

          <div class="summary-box">
            <div class="summary-item">
              <div class="summary-label">Activities</div>
              <div class="summary-value">
                ${activities.length}
              </div>
            </div>

            <div class="summary-item">
              <div class="summary-label">Total Cost</div>
              <div class="summary-value">
                ${formatNumber(
                  activities.reduce(
                    (total, item) => total + Number(item.cost || 0),
                    0
                  )
                )}
              </div>
            </div>

            <div class="summary-item">
              <div class="summary-label">Leads Target</div>
              <div class="summary-value">
                ${formatNumber(
                  activities.reduce(
                    (total, item) =>
                      total + Number(item.leadsTarget || 0),
                    0
                  )
                )}
              </div>
            </div>
          </div>

          <div class="activity-list" id="activity-list-${month.value}">
            ${
              activities.length === 0
                ? `
                  <div class="empty-message">
                    No activities saved for this month.
                  </div>
                `
                : ""
            }
          </div>

          ${
            completed
              ? `
                <div class="button-row">
                  <button
                    type="button"
                    class="btn-secondary"
                    onclick="openMonthForm('${month.value}')"
                  >
                    Add More Activity
                  </button>
                </div>
              `
              : `
                <div class="button-row">
                  <button
                    type="button"
                    class="btn-primary"
                    onclick="openMonthForm('${month.value}')"
                  >
                    Add Activity for ${escapeHtml(month.label)}
                  </button>

                  <button
                    type="button"
                    class="btn-success"
                    onclick="completeMonth('${month.value}')"
                  >
                    Finish Month & Continue
                  </button>
                </div>
              `
          }
        `;

        monthlyActivitiesContainer.appendChild(monthBox);

        const listContainer = document.getElementById(
          `activity-list-${month.value}`
        );

        activities.forEach(activity => {
          listContainer.appendChild(
            createActivityCard(activity)
          );
        });
      });

      const allMonths = getPlanningMonths();

      if (visibleMonths.length < allMonths.length) {
        const nextMonth = allMonths[visibleMonths.length];

        const lockedBox = document.createElement("div");
        lockedBox.className = "month-box locked-month";

        lockedBox.innerHTML = `
          <div class="month-title">
            <h3>${escapeHtml(nextMonth.label)}</h3>
            <span class="month-status locked">
              Locked
            </span>
          </div>

          <div class="locked-message">
            Complete the previous month before continuing
            to ${escapeHtml(nextMonth.label)}.
          </div>
        `;

        monthlyActivitiesContainer.appendChild(lockedBox);
      }
    }

    function createActivityCard(activity) {
      const card = document.createElement("div");
      card.className = "activity-card";

      card.innerHTML = `
        <div class="activity-card-header">
          <div class="activity-card-title">
            ${escapeHtml(activity.activityType)}
          </div>

          <div class="activity-card-actions">
            <button
              type="button"
              class="btn-warning"
              onclick="editActivity('${activity.id}')"
            >
              Edit
            </button>

            <button
              type="button"
              class="btn-danger"
              onclick="deleteActivity('${activity.id}')"
            >
              Delete
            </button>
          </div>
        </div>

        <div class="activity-detail-grid">
          <div class="detail-item">
            <strong>Planning Month:</strong>
            ${escapeHtml(getMonthLabel(activity.planningMonth))}
          </div>

          <div class="detail-item">
            <strong>Region:</strong>
            ${escapeHtml(activity.region)}
          </div>

          <div class="detail-item">
            <strong>Partner:</strong>
            ${escapeHtml(activity.partner)}
          </div>

          <div class="detail-item">
            <strong>Activity Type:</strong>
            ${escapeHtml(activity.activityType)}
          </div>

          <div class="detail-item">
            <strong>Location:</strong>
            ${escapeHtml(activity.location)}
          </div>

          <div class="detail-item">
            <strong>Location Detail:</strong>
            ${escapeHtml(activity.locationDetail || "-")}
          </div>

          <div class="detail-item">
            <strong>Start Date:</strong>
            ${escapeHtml(activity.startDate)}
          </div>

          <div class="detail-item">
            <strong>End Date:</strong>
            ${escapeHtml(activity.endDate)}
          </div>

          <div class="detail-item">
            <strong>Cost:</strong>
            ${formatNumber(activity.cost)}
          </div>

          <div class="detail-item">
            <strong>Leads Target:</strong>
            ${formatNumber(activity.leadsTarget)}
          </div>

          <div class="detail-item">
            <strong>Test Drive Target:</strong>
            ${formatNumber(activity.testDriveTarget)}
          </div>

          <div class="detail-item">
            <strong>Booking Target:</strong>
            ${formatNumber(activity.bookingTarget)}
          </div>

          <div class="detail-item full-width">
            <strong>Remark:</strong>
            ${escapeHtml(activity.remark || "-")}
          </div>
        </div>
      `;

      return card;
    }

    function openMonthForm(monthValue) {
      selectedPlanningMonth = monthValue;
      planningMonthInput.value = monthValue;

      const [year, month] = monthValue
        .split("-")
        .map(Number);

      const firstDay = `${year}-${String(month).padStart(2, "0")}-01`;

      const lastDayDate = new Date(year, month, 0);

      const lastDay =
        lastDayDate.getFullYear() +
        "-" +
        String(lastDayDate.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(lastDayDate.getDate()).padStart(2, "0");

      startDateInput.min = firstDay;
      startDateInput.max = lastDay;
      endDateInput.min = firstDay;
      endDateInput.max = lastDay;

      resetActivityForm(false);

      document
        .querySelector(".section:nth-of-type(2)")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
    }

    function completeMonth(monthValue) {
      const activities = getActivitiesByMonth(monthValue);

      if (activities.length === 0) {
        showStatus(
          "Please save at least one activity before completing this month.",
          "error"
        );
        return;
      }

      if (!completedMonths.includes(monthValue)) {
        completedMonths.push(monthValue);
      }

      saveToLocalStorage();
      renderMonthlyActivities();

      const months = getPlanningMonths();
      const currentIndex = months.findIndex(
        month => month.value === monthValue
      );

      if (currentIndex >= 0 && currentIndex < months.length - 1) {
        const nextMonth = months[currentIndex + 1];

        showStatus(
          `${getMonthLabel(monthValue)} completed. ${getMonthLabel(
            nextMonth.value
          )} is now available.`,
          "success"
        );

        openMonthForm(nextMonth.value);
      } else {
        showStatus(
          `${getMonthLabel(monthValue)} completed successfully.`,
          "success"
        );
      }
    }

    regionInput.addEventListener("change", function () {
      const selectedRegion = regionInput.value;

      partnerInput.innerHTML =
        '<option value="">Select Partner</option>';

      if (!selectedRegion || !partnerData[selectedRegion]) {
        partnerInput.disabled = true;
        return;
      }

      partnerData[selectedRegion].forEach(partner => {
        const option = document.createElement("option");

        option.value = partner;
        option.textContent = partner;

        partnerInput.appendChild(option);
      });

      partnerInput.disabled = false;
    });

    planningMonthInput.addEventListener("change", function () {
      selectedPlanningMonth = planningMonthInput.value;

      if (selectedPlanningMonth) {
        openMonthForm(selectedPlanningMonth);
      }

      renderMonthlyActivities();
    });

    activityTypeInput.addEventListener(
      "change",
      updateLocationOptions
    );

    locationInput.addEventListener(
      "change",
      updateLocationDetail
    );

    function updateLocationOptions() {
      const activityType = activityTypeInput.value;

      locationInput.innerHTML =
        '<option value="">Select Location</option>';

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;
      locationDetailInput.value = "";

      if (
        activityType === "Pop up/Roadshow" ||
        activityType === "Mini motor show"
      ) {
        shoppingLocations.forEach(location => {
          addOption(locationInput, location, location);
        });
      } else if (activityType === "Showroom event") {
        const selectedRegion = regionInput.value;

        if (selectedRegion && partnerData[selectedRegion]) {
          partnerData[selectedRegion].forEach(partner => {
            addOption(locationInput, partner, partner);
          });
        }
      } else if (
        activityType === "Test Drive/Outdoor event"
      ) {
        testDriveLocations.forEach(location => {
          addOption(locationInput, location, location);
        });
      } else if (activityType === "Online") {
        onlineChannels.forEach(channel => {
          addOption(locationInput, channel, channel);
        });
      } else if (activityType === "Billboard") {
        addOption(
          locationInput,
          "Billboard Location",
          "Billboard Location"
        );

        locationDetailWrapper.classList.remove("hidden");
        locationDetailInput.required = true;
        locationDetailInput.placeholder =
          "Enter billboard location";
      }
    }

    function updateLocationDetail() {
      const activityType = activityTypeInput.value;
      const location = locationInput.value;

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;
      locationDetailInput.value = "";

      if (
        activityType === "Pop up/Roadshow" ||
        activityType === "Mini motor show"
      ) {
        if (location === "Other") {
          locationDetailWrapper.classList.remove("hidden");
          locationDetailInput.required = true;
          locationDetailInput.placeholder =
            "Enter location";
        } else if (location) {
          locationDetailWrapper.classList.remove("hidden");
          locationDetailInput.required = true;
          locationDetailInput.placeholder =
            "Enter branch / area of the location";
        }
      } else if (
        activityType === "Test Drive/Outdoor event" &&
        location === "Outdoor"
      ) {
        locationDetailWrapper.classList.remove("hidden");
        locationDetailInput.required = true;
        locationDetailInput.placeholder =
          "Enter outdoor location";
      }
    }

    function addOption(selectElement, value, text) {
      const option = document.createElement("option");

      option.value = value;
      option.textContent = text;

      selectElement.appendChild(option);
    }

    activityForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!regionInput.value || !partnerInput.value) {
        showStatus(
          "Please select Region and Partner first.",
          "error"
        );
        return;
      }

      if (!selectedPlanningMonth) {
        showStatus(
          "Please select Planning Month first.",
          "error"
        );
        return;
      }

      if (!activityForm.checkValidity()) {
        activityForm.reportValidity();
        return;
      }

      if (endDateInput.value < startDateInput.value) {
        showStatus(
          "End Date cannot be earlier than Start Date.",
          "error"
        );
        return;
      }

      if (
        startDateInput.value < startDateInput.min ||
        endDateInput.value > endDateInput.max
      ) {
        showStatus(
          "Activity dates must be within the selected planning month.",
          "error"
        );
        return;
      }

      const activity = {
        id: editingId || generateId(),
        planningMonth: selectedPlanningMonth,
        region: regionInput.value,
        partner: partnerInput.value,
        activityType: activityTypeInput.value,
        location: locationInput.value,
        locationDetail: locationDetailInput.value,
        startDate: startDateInput.value,
        endDate: endDateInput.value,
        cost: Number(costInput.value) || 0,
        leadsTarget: Number(leadsTargetInput.value) || 0,
        testDriveTarget:
          Number(testDriveTargetInput.value) || 0,
        bookingTarget:
          Number(bookingTargetInput.value) || 0,
        remark: remarkInput.value,
        updatedAt: new Date().toISOString()
      };

      if (editingId) {
        const index = savedActivities.findIndex(
          item => item.id === editingId
        );

        if (index >= 0) {
          savedActivities[index] = activity;
        }

        showStatus(
          "Activity updated successfully.",
          "success"
        );
      } else {
        savedActivities.push(activity);

        showStatus(
          "Activity saved successfully.",
          "success"
        );
      }

      saveToLocalStorage();
      renderMonthlyActivities();
      resetActivityForm(false);
    });

    cancelEditButton.addEventListener("click", function () {
      resetActivityForm(false);
    });

    finishMonthButton.addEventListener("click", function () {
      if (!selectedPlanningMonth) {
        showStatus(
          "Please select Planning Month first.",
          "error"
        );
        return;
      }

      completeMonth(selectedPlanningMonth);
    });

    submitAllButton.addEventListener(
      "click",
      async function () {
        if (savedActivities.length === 0) {
          showStatus(
            "Please save at least one activity before submitting.",
            "error"
          );
          return;
        }

        if (
          !GOOGLE_SCRIPT_URL ||
          GOOGLE_SCRIPT_URL ===
            "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
        ) {
          showStatus(
            "Please insert your Google Apps Script Web App URL first.",
            "error"
          );
          return;
        }

        const submissionData = {
          submittedAt: new Date().toISOString(),
          activities: savedActivities
        };

        submitAllButton.disabled = true;
        submitAllButton.textContent = "Submitting...";

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(submissionData)
          });

          showStatus(
            "Activities submitted successfully.",
            "success"
          );
        } catch (error) {
          console.error(error);

          showStatus(
            "Unable to submit activities. Please check your Web App URL.",
            "error"
          );
        } finally {
          submitAllButton.disabled = false;
          submitAllButton.textContent =
            "Submit All Activities";
        }
      }
    );

    window.editActivity = function (activityId) {
      const activity = savedActivities.find(
        item => item.id === activityId
      );

      if (!activity) return;

      editingId = activityId;
      selectedPlanningMonth = activity.planningMonth;

      planningMonthInput.value = activity.planningMonth;
      regionInput.value = activity.region;

      regionInput.dispatchEvent(new Event("change"));

      partnerInput.value = activity.partner;

      activityTypeInput.value = activity.activityType;
      updateLocationOptions();

      locationInput.value = activity.location;
      updateLocationDetail();

      locationDetailInput.value =
        activity.locationDetail || "";

      startDateInput.value = activity.startDate;
      endDateInput.value = activity.endDate;
      costInput.value = activity.cost;
      leadsTargetInput.value = activity.leadsTarget;
      testDriveTargetInput.value = activity.testDriveTarget;
      bookingTargetInput.value = activity.bookingTarget;
      remarkInput.value = activity.remark || "";

      setDateLimits(activity.planningMonth);

      editingLabel.classList.remove("hidden");
      cancelEditButton.classList.remove("hidden");
      saveButton.textContent = "Update Activity";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    window.deleteActivity = function (activityId) {
      const activity = savedActivities.find(
        item => item.id === activityId
      );

      if (!activity) return;

      const confirmed = confirm(
        `Delete activity "${activity.activityType}"?`
      );

      if (!confirmed) return;

      savedActivities = savedActivities.filter(
        item => item.id !== activityId
      );

      saveToLocalStorage();
      renderMonthlyActivities();

      if (editingId === activityId) {
        resetActivityForm(false);
      }

      showStatus(
        "Activity deleted successfully.",
        "success"
      );
    };

    window.openMonthForm = openMonthForm;
    window.completeMonth = completeMonth;

    function setDateLimits(monthValue) {
      const [year, month] = monthValue
        .split("-")
        .map(Number);

      const firstDay =
        `${year}-${String(month).padStart(2, "0")}-01`;

      const lastDayDate = new Date(year, month, 0);

      const lastDay =
        lastDayDate.getFullYear() +
        "-" +
        String(lastDayDate.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(lastDayDate.getDate()).padStart(2, "0");

      startDateInput.min = firstDay;
      startDateInput.max = lastDay;
      endDateInput.min = firstDay;
      endDateInput.max = lastDay;
    }

    function resetActivityForm(clearMonth = false) {
      activityForm.reset();

      editingId = null;

      if (clearMonth) {
        selectedPlanningMonth = "";
        planningMonthInput.value = "";
      }

      if (selectedPlanningMonth) {
        setDateLimits(selectedPlanningMonth);
      }

      locationInput.innerHTML =
        '<option value="">Select Location</option>';

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;

      editingLabel.classList.add("hidden");
      cancelEditButton.classList.add("hidden");
      saveButton.textContent = "Save Activity";
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status-message";

      if (type === "success") {
        statusMessage.classList.add("status-success");
      } else {
        statusMessage.classList.add("status-error");
      }
    }

    populatePlanningMonths();
    renderMonthlyActivities();
  </script>
</body>
</html>
