<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Partner Activity Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background: #ffffff;
      padding: 34px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 30px;
      color: #172554;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 23px;
      color: #1e3a8a;
    }

    h3 {
      margin: 0 0 14px;
      font-size: 19px;
      color: #1e3a8a;
    }

    .section {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid #e5e7eb;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 26px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    label {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #1e3a5f;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #111827;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .required {
      color: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    .location-box {
      padding: 18px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      background: #eff6ff;
    }

    .location-box label {
      color: #1e40af;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      min-height: 46px;
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #1d4ed8;
      color: white;
    }

    .btn-success {
      background: #15803d;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .saved-section {
      margin-top: 30px;
    }

    .activity-card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #f8fafc;
    }

    .activity-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .activity-card-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e3a8a;
    }

    .activity-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .activity-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 22px;
    }

    .detail-item {
      font-size: 14px;
      line-height: 1.6;
    }

    .detail-item strong {
      color: #334155;
    }

    .empty-message {
      padding: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      text-align: center;
      color: #64748b;
    }

    .status-message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: 600;
      display: none;
    }

    .status-success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .status-error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .editing-label {
      margin-bottom: 18px;
      padding: 12px 16px;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 22px 16px;
      }

      .form-grid,
      .activity-detail-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .activity-card-header {
        flex-direction: column;
        align-items: flex-start;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Partner Activity Form</h1>

    <div class="section">
      <h2>Partner Information</h2>

      <div class="form-grid">
        <div class="field">
          <label for="region">
            Region <span class="required">*</span>
          </label>

          <select id="region" required>
            <option value="">Select Region</option>
            <option value="BKK">BKK</option>
            <option value="CEW">CEW</option>
            <option value="N">N</option>
            <option value="NE">NE</option>
            <option value="S">S</option>
          </select>
        </div>

        <div class="field">
          <label for="partner">
            Partner <span class="required">*</span>
          </label>

          <select id="partner" required disabled>
            <option value="">Select Partner</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Add Activity</h2>

      <div id="editingLabel" class="editing-label hidden">
        Editing existing activity
      </div>

      <form id="activityForm">
        <div class="form-grid">

          <!-- Activity Type: top left -->
          <div class="field">
            <label for="activityType">
              Activity Type <span class="required">*</span>
            </label>

            <select id="activityType" required>
              <option value="">Select Activity Type</option>
              <option value="Pop up/Roadshow">Pop up/Roadshow</option>
              <option value="Showroom event">Showroom event</option>
              <option value="Test Drive/Outdoor event">
                Test Drive/Outdoor event
              </option>
              <option value="Online">Online</option>
              <option value="Mini motor show">Mini motor show</option>
              <option value="Billboard">Billboard</option>
            </select>
          </div>

          <!-- Location: full width under Activity Type -->
          <div class="full-width location-box">
            <div class="field">
              <label for="location">
                Location <span class="required">*</span>
              </label>

              <select id="location" required>
                <option value="">Select Location</option>
              </select>
            </div>

            <div class="field hidden" id="locationDetailWrapper">
              <label for="locationDetail">
                Branch / Area / Location Detail
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="locationDetail"
                placeholder="Enter branch, area or location"
              />
            </div>
          </div>

          <!-- Start Date: bottom left -->
          <div class="field">
            <label for="startDate">
              Start Date <span class="required">*</span>
            </label>

            <input type="date" id="startDate" required />
          </div>

          <!-- End Date: bottom right -->
          <div class="field">
            <label for="endDate">
              End Date <span class="required">*</span>
            </label>

            <input type="date" id="endDate" required />
          </div>

          <div class="field">
            <label for="cost">
              Cost <span class="required">*</span>
            </label>

            <input
              type="number"
              id="cost"
              min="0"
              step="0.01"
              placeholder="Enter cost"
              required
            />
          </div>

          <div class="field">
            <label for="leadsTarget">
              Leads Target
            </label>

            <input
              type="number"
              id="leadsTarget"
              min="0"
              placeholder="Enter Leads Target"
            />
          </div>

          <div class="field">
            <label for="testDriveTarget">
              Test Drive Target
            </label>

            <input
              type="number"
              id="testDriveTarget"
              min="0"
              placeholder="Enter Test Drive Target"
            />
          </div>

          <div class="field">
            <label for="bookingTarget">
              Booking Target
            </label>

            <input
              type="number"
              id="bookingTarget"
              min="0"
              placeholder="Enter Booking Target"
            />
          </div>

          <div class="field full-width">
            <label for="remark">
              Remark
            </label>

            <textarea
              id="remark"
              placeholder="Enter remark"
            ></textarea>
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="btn-primary" id="saveButton">
            Save Activity
          </button>

          <button
            type="button"
            class="btn-secondary hidden"
            id="cancelEditButton"
          >
            Cancel Edit
          </button>

          <button
            type="button"
            class="btn-success"
            id="submitAllButton"
          >
            Submit All Activities
          </button>
        </div>
      </form>

      <div id="statusMessage" class="status-message"></div>
    </div>

    <div class="saved-section">
      <h2>Saved Activities</h2>

      <div id="savedActivities">
        <div class="empty-message">
          No activities saved yet.
        </div>
      </div>
    </div>
  </div>

  <script>
    /*
      ใส่ Web App URL ของ Google Apps Script ตรงนี้
      ตัวอย่าง:
      https://script.google.com/macros/s/xxxxxxxxxxxxxxxx/exec
    */
    const GOOGLE_SCRIPT_URL =
      "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    const partnerData = {
      BKK: [
        "GWM AAG Rangsit",
        "GWM E.V.S Plus Nonthaburi",
        "GWM Amorn Ratchada",
        "GWM PAG Udomsuk",
        "GWM ITG Auto Navanakorn",
        "GWM Iconic Ramintra",
        "GWM Prestige Pathumthani",
        "GWM Prestige Thanyaburi",
        "GWM One Theparak",
        "GWM Charansanitwong",
        "GWM Bangkok Chan Road",
        "GWM Ek Ari",
        "GWM Premier Srinakarin",
        "GWM Metro Hathairat",
        "GWM Startrek Suanluang",
        "GWM V Ultimatecar Bang Bua Thong",
        "GWM Great One Auto Chaengwattana",
        "GWM Suvarnabhumi Ladkrabang",
        "GWM Eaksaha Phahonyothin KM.25",
        "GWM WEY Suvarnabhumi Central Bangna",
        "GWM CCC Auto Vacharaphol",
        "GWM Maporn Lamlukka",
        "GWM 168 Kanchanaphisek",
        "GWM Maverick Auto Ramkhamhaeng",
        "GWM Motor Mall Rama 2",
        "GWM Phuttmon Sai 4"
      ],

      CEW: [
        "GWM Ch.Erawan Kanchanaburi",
        "GWM Ch.Erawan Ratchaburi",
        "GWM Ch.Erawan Suphanburi",
        "GWM Ch.Erawan Nakhonpathom",
        "GWM PAG Saraburi",
        "GWM Ek Chonburi",
        "GWM Ek Pattaya",
        "GWM Ek Chanthaburi",
        "GWM Ek Rayong",
        "GWM Ek Rayong Pluakdaeng",
        "GWM First Class Motor Chachoengsao",
        "GWM APM Ayutthaya",
        "GWM Thairungruang Lopburi",
        "GWM Tongcharoen Samutsakhon",
        "GWM Sitthiphan Phetchaburi",
        "GWM Tara Huahin"
      ],

      N: [
        "GWM Angelway Chiangrai",
        "GWM Angelway Phayao",
        "GWM M1X Maesod",
        "GWM M1X Phitsanulok",
        "GWM P and Y Sukhothai",
        "GWM PAG Nakhonsawan",
        "GWM CCC Auto Chiangmai",
        "GWM CCC Auto Chiangmai Maerim",
        "GWM CCC Auto Lampang"
      ],

      NE: [
        "GWM Pattanachaiyon Loei",
        "GWM Pijitphet Sakonnakhon",
        "GWM Sahachai EV Plus Khonkaen",
        "GWM Teeka Udonthani",
        "GWM A S Surin",
        "GWM CCC Auto Roiet",
        "GWM CCC Auto Ubonratchathani",
        "GWM Eaksaha Korat",
        "GWM Eaksaha Plus Buriram",
        "GWM Mundee Kalasin",
        "GWM Thaiyont Next Sisaket"
      ],

      S: [
        "GWM Chookiat Hatyai",
        "GWM Chookiat Songkhla",
        "GWM A.N.N. Pattani",
        "GWM YAS Yala",
        "GWM Origin Chumphon",
        "GWM KT Suratthani",
        "GWM Anuphas Phuket",
        "GWM Anuphas Phuket Kathu",
        "GWM Chookiat Krabi",
        "GWM Chookiat Trang"
      ]
    };

    const shoppingLocations = [
      "Big C",
      "Central",
      "Fashion Island",
      "Home Pro",
      "Lotus",
      "Makro",
      "Market Village",
      "Robinson",
      "Seacon",
      "The Mall",
      "Terminal 21",
      "Mega Bangna",
      "The Street",
      "Future park",
      "PTT",
      "Bangchak",
      "Café",
      "University",
      "Other"
    ];

    const onlineChannels = [
      "Line",
      "Facebook",
      "Google",
      "Instagram",
      "Tiktok",
      "YouTube"
    ];

    const testDriveLocations = [
      "Showroom",
      "Outdoor"
    ];

    let savedActivities = JSON.parse(
      localStorage.getItem("partnerActivityData") || "[]"
    );

    let editingIndex = -1;

    const regionInput = document.getElementById("region");
    const partnerInput = document.getElementById("partner");
    const activityTypeInput = document.getElementById("activityType");
    const activityNameInput = document.getElementById("activityName");
    const locationInput = document.getElementById("location");
    const locationDetailInput = document.getElementById("locationDetail");
    const locationDetailWrapper = document.getElementById(
      "locationDetailWrapper"
    );
    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const costInput = document.getElementById("cost");
    const leadsTargetInput = document.getElementById("leadsTarget");
    const testDriveTargetInput = document.getElementById(
      "testDriveTarget"
    );
    const bookingTargetInput = document.getElementById(
      "bookingTarget"
    );
    const remarkInput = document.getElementById("remark");

    const activityForm = document.getElementById("activityForm");
    const savedActivitiesContainer =
      document.getElementById("savedActivities");

    const saveButton = document.getElementById("saveButton");
    const cancelEditButton =
      document.getElementById("cancelEditButton");

    const submitAllButton =
      document.getElementById("submitAllButton");

    const editingLabel =
      document.getElementById("editingLabel");

    const statusMessage =
      document.getElementById("statusMessage");

    regionInput.addEventListener("change", function () {
      const selectedRegion = regionInput.value;

      partnerInput.innerHTML =
        '<option value="">Select Partner</option>';

      if (!selectedRegion || !partnerData[selectedRegion]) {
        partnerInput.disabled = true;
        return;
      }

      partnerData[selectedRegion].forEach(function (partner) {
        const option = document.createElement("option");
        option.value = partner;
        option.textContent = partner;
        partnerInput.appendChild(option);
      });

      partnerInput.disabled = false;
    });

    activityTypeInput.addEventListener("change", function () {
      updateLocationOptions();
    });

    locationInput.addEventListener("change", function () {
      updateLocationDetail();
    });

    function updateLocationOptions() {
      const activityType = activityTypeInput.value;

      locationInput.innerHTML =
        '<option value="">Select Location</option>';

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;
      locationDetailInput.value = "";

      if (
        activityType === "Pop up/Roadshow" ||
        activityType === "Mini motor show"
      ) {
        shoppingLocations.forEach(function (location) {
          addOption(locationInput, location, location);
        });
      }

      else if (activityType === "Showroom event") {
        const selectedRegion = regionInput.value;

        if (selectedRegion && partnerData[selectedRegion]) {
          partnerData[selectedRegion].forEach(function (partner) {
            addOption(locationInput, partner, partner);
          });
        }
      }

      else if (activityType === "Test Drive/Outdoor event") {
        testDriveLocations.forEach(function (location) {
          addOption(locationInput, location, location);
        });
      }

      else if (activityType === "Online") {
        onlineChannels.forEach(function (channel) {
          addOption(locationInput, channel, channel);
        });
      }

      else if (activityType === "Billboard") {
        addOption(
          locationInput,
          "Billboard Location",
          "Billboard Location"
        );

        locationDetailWrapper.classList.remove("hidden");
        locationDetailInput.required = true;
      }
    }

    function updateLocationDetail() {
      const activityType = activityTypeInput.value;
      const location = locationInput.value;

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;

      if (
        activityType === "Pop up/Roadshow" ||
        activityType === "Mini motor show"
      ) {
        if (location === "Other") {
          locationDetailWrapper.classList.remove("hidden");
          locationDetailInput.required = true;
          locationDetailInput.placeholder =
            "Enter location";
        } else if (location) {
          locationDetailWrapper.classList.remove("hidden");
          locationDetailInput.required = true;
          locationDetailInput.placeholder =
            "Enter branch / area of the location";
        }
      }

      else if (
        activityType === "Test Drive/Outdoor event" &&
        location === "Outdoor"
      ) {
        locationDetailWrapper.classList.remove("hidden");
        locationDetailInput.required = true;
        locationDetailInput.placeholder =
          "Enter outdoor location";
      }
    }

    function addOption(selectElement, value, text) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = text;
      selectElement.appendChild(option);
    }

    activityForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!activityForm.checkValidity()) {
        activityForm.reportValidity();
        return;
      }

      if (endDateInput.value < startDateInput.value) {
        showStatus(
          "End Date cannot be earlier than Start Date.",
          "error"
        );
        return;
      }

      const activity = {
        id:
          editingIndex >= 0
            ? savedActivities[editingIndex].id
            : generateId(),

        region: regionInput.value,
        partner: partnerInput.value,
        activityType: activityTypeInput.value,
        activityName: activityNameInput.value,
        location: locationInput.value,
        locationDetail: locationDetailInput.value,
        startDate: startDateInput.value,
        endDate: endDateInput.value,
        cost: Number(costInput.value) || 0,
        leadsTarget: Number(leadsTargetInput.value) || 0,
        testDriveTarget:
          Number(testDriveTargetInput.value) || 0,
        bookingTarget:
          Number(bookingTargetInput.value) || 0,
        remark: remarkInput.value,
        updatedAt: new Date().toISOString()
      };

      if (editingIndex >= 0) {
        savedActivities[editingIndex] = activity;
        showStatus("Activity updated successfully.", "success");
      } else {
        savedActivities.push(activity);
        showStatus("Activity saved successfully.", "success");
      }

      saveToLocalStorage();
      renderSavedActivities();
      resetForm();
    });

    cancelEditButton.addEventListener("click", function () {
      resetForm();
    });

    submitAllButton.addEventListener("click", async function () {
      if (savedActivities.length === 0) {
        showStatus(
          "Please save at least one activity before submitting.",
          "error"
        );
        return;
      }

      if (
        !GOOGLE_SCRIPT_URL ||
        GOOGLE_SCRIPT_URL ===
          "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
      ) {
        showStatus(
          "Please insert your Google Apps Script Web App URL first.",
          "error"
        );
        return;
      }

      const submissionData = {
        submittedAt: new Date().toISOString(),
        activities: savedActivities
      };

      submitAllButton.disabled = true;
      submitAllButton.textContent = "Submitting...";

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(submissionData)
        });

        showStatus(
          "Activities submitted successfully.",
          "success"
        );
      } catch (error) {
        console.error(error);

        showStatus(
          "Unable to submit activities. Please check your Web App URL.",
          "error"
        );
      } finally {
        submitAllButton.disabled = false;
        submitAllButton.textContent = "Submit All Activities";
      }
    });

    function renderSavedActivities() {
      savedActivitiesContainer.innerHTML = "";

      if (savedActivities.length === 0) {
        savedActivitiesContainer.innerHTML = `
          <div class="empty-message">
            No activities saved yet.
          </div>
        `;
        return;
      }

      savedActivities.forEach(function (activity, index) {
        const card = document.createElement("div");
        card.className = "activity-card";

        card.innerHTML = `
          <div class="activity-card-header">
            <div class="activity-card-title">
              ${index + 1}. ${escapeHtml(activity.activityName)}
            </div>

            <div class="activity-card-actions">
              <button
                type="button"
                class="btn-warning"
                onclick="editActivity(${index})"
              >
                Edit
              </button>

              <button
                type="button"
                class="btn-danger"
                onclick="deleteActivity(${index})"
              >
                Delete
              </button>
            </div>
          </div>

          <div class="activity-detail-grid">
            <div class="detail-item">
              <strong>Region:</strong>
              ${escapeHtml(activity.region)}
            </div>

            <div class="detail-item">
              <strong>Partner:</strong>
              ${escapeHtml(activity.partner)}
            </div>

            <div class="detail-item">
              <strong>Activity Type:</strong>
              ${escapeHtml(activity.activityType)}
            </div>

            <div class="detail-item">
              <strong>Location:</strong>
              ${escapeHtml(activity.location)}
            </div>

            <div class="detail-item">
              <strong>Location Detail:</strong>
              ${escapeHtml(activity.locationDetail || "-")}
            </div>

            <div class="detail-item">
              <strong>Start Date:</strong>
              ${escapeHtml(activity.startDate)}
            </div>

            <div class="detail-item">
              <strong>End Date:</strong>
              ${escapeHtml(activity.endDate)}
            </div>

            <div class="detail-item">
              <strong>Cost:</strong>
              ${formatNumber(activity.cost)}
            </div>

            <div class="detail-item">
              <strong>Leads Target:</strong>
              ${formatNumber(activity.leadsTarget)}
            </div>

            <div class="detail-item">
              <strong>Test Drive Target:</strong>
              ${formatNumber(activity.testDriveTarget)}
            </div>

            <div class="detail-item">
              <strong>Booking Target:</strong>
              ${formatNumber(activity.bookingTarget)}
            </div>

            <div class="detail-item">
              <strong>Remark:</strong>
              ${escapeHtml(activity.remark || "-")}
            </div>
          </div>
        `;

        savedActivitiesContainer.appendChild(card);
      });
    }

    window.editActivity = function (index) {
      const activity = savedActivities[index];

      if (!activity) return;

      editingIndex = index;

      regionInput.value = activity.region;
      regionInput.dispatchEvent(new Event("change"));

      partnerInput.value = activity.partner;

      activityTypeInput.value = activity.activityType;
      updateLocationOptions();

      activityNameInput.value = activity.activityName;
      locationInput.value = activity.location;
      updateLocationDetail();

      locationDetailInput.value = activity.locationDetail || "";
      startDateInput.value = activity.startDate;
      endDateInput.value = activity.endDate;
      costInput.value = activity.cost;
      leadsTargetInput.value = activity.leadsTarget;
      testDriveTargetInput.value = activity.testDriveTarget;
      bookingTargetInput.value = activity.bookingTarget;
      remarkInput.value = activity.remark || "";

      editingLabel.classList.remove("hidden");
      cancelEditButton.classList.remove("hidden");
      saveButton.textContent = "Update Activity";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    window.deleteActivity = function (index) {
      const activity = savedActivities[index];

      if (!activity) return;

      const confirmed = confirm(
        `Delete activity "${activity.activityName}"?`
      );

      if (!confirmed) return;

      savedActivities.splice(index, 1);

      saveToLocalStorage();
      renderSavedActivities();

      if (editingIndex === index) {
        resetForm();
      }

      showStatus("Activity deleted successfully.", "success");
    };

    function resetForm() {
      activityForm.reset();

      editingIndex = -1;

      partnerInput.innerHTML =
        '<option value="">Select Partner</option>';
      partnerInput.disabled = true;

      locationInput.innerHTML =
        '<option value="">Select Location</option>';

      locationDetailWrapper.classList.add("hidden");
      locationDetailInput.required = false;

      editingLabel.classList.add("hidden");
      cancelEditButton.classList.add("hidden");
      saveButton.textContent = "Save Activity";
    }

    function saveToLocalStorage() {
      localStorage.setItem(
        "partnerActivityData",
        JSON.stringify(savedActivities)
      );
    }

    function generateId() {
      return (
        "ACT-" +
        Date.now() +
        "-" +
        Math.random().toString(36).substring(2, 8)
      );
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status-message";

      if (type === "success") {
        statusMessage.classList.add("status-success");
      } else {
        statusMessage.classList.add("status-error");
      }
    }

    renderSavedActivities();
  </script>
</body>
</html>
